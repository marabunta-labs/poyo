# Cada mes baja España de Geofabrik, regenera data/osm/spain.json.gz y, si cambió, lo sube a main (Render redespliega).
# El resumen de sitios nuevos y quitados queda en el resumen de la ejecución y en el mensaje del commit.
name: poyo-refresh-osm
on:
  schedule: [{ cron: '0 5 1 * *' }]   # día 1 de cada mes, 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Importar España (descarga ~1,5 GB, unos 10 min)
        run: DATA_DIR="$RUNNER_TEMP/data" node scripts/import-osm.js
      - name: Resumen y volcado comprimido
        run: |
          node scripts/osm-diff.js data/osm/spain.json.gz "$RUNNER_TEMP/data/osm/spain.json" > "$RUNNER_TEMP/resumen.md"
          cat "$RUNNER_TEMP/resumen.md" >> "$GITHUB_STEP_SUMMARY"
          gzip -9 -c "$RUNNER_TEMP/data/osm/spain.json" > data/osm/spain.json.gz
      - name: Subir a main si cambió
        run: |
          git config user.name poyo-bot
          git config user.email poyo-bot@users.noreply.github.com
          git add data/osm/spain.json.gz
          git diff --cached --quiet && { echo 'Sin cambios'; exit 0; }
          git commit -m 'Actualiza el volcado de OpenStreetMap' -m "$(cat "$RUNNER_TEMP/resumen.md")"
          git pull --rebase origin main
          git push origin HEAD:main
