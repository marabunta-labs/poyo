# Cada mes baja España de Geofabrik, regenera data/osm/spain.json.gz y abre una pull request con el resumen de sitios
# nuevos y quitados. Al aceptarla, Render redespliega con el volcado nuevo. (Ajustes del repo → Actions → «Allow GitHub
# Actions to create and approve pull requests» debe estar activado.)
name: poyo-refresh-osm
on:
  schedule: [{ cron: '0 5 1 * *' }]   # día 1 de cada mes, 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Importar España (descarga ~1,5 GB, unos 10 min)
        run: DATA_DIR="$RUNNER_TEMP/data" node scripts/import-osm.js
      - name: Resumen y volcado comprimido
        run: |
          node scripts/osm-diff.js data/osm/spain.json.gz "$RUNNER_TEMP/data/osm/spain.json" > "$RUNNER_TEMP/resumen.md"
          cat "$RUNNER_TEMP/resumen.md" >> "$GITHUB_STEP_SUMMARY"
          gzip -9 -c "$RUNNER_TEMP/data/osm/spain.json" > data/osm/spain.json.gz
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: osm-refresh
          add-paths: data/osm/spain.json.gz
          title: Actualiza el volcado de OpenStreetMap
          commit-message: Actualiza el volcado de OpenStreetMap
          body-path: ${{ runner.temp }}/resumen.md
          delete-branch: true
